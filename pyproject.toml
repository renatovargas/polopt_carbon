[project]
name = "polopt-carbon"
version = "1.0.0"
description = "Prepare carbon density maps and InVEST carbon tables from land cover data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Renato Vargas" }]

dependencies = [
  "geopandas>=1.0",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "rasterio>=1.3",
  "rich>=13.0",
  "rioxarray>=0.15",
  "shapely>=2.0",
  "typer>=0.16",
]

[project.scripts]
polopt-carbon = "polopt_carbon.cli:main"

[project.urls]
Repository = "https://github.com/renatovargas/polopt_carbon"
Documentation = "https://renatovargas.github.io/polopt_carbon/"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polopt_carbon"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs", "/testdata", "/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["uganda: requires the local testdata/uga folder"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = ["scripts", "docs"]
